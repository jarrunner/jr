# Builds jr (the Java/TeaVM launcher under jr/) from source on a clean Windows machine, signs it
# through SignPath Foundation, and publishes it as a GitHub release. Run by pushing a tag vX.Y.Z,
# or by hand from the Actions tab: with publish unticked it only builds, and the exes are kept as
# a workflow artifact, which is how a change to this file is tested.
#
# Inputs, all fetched by this workflow, nothing from the maintainer's machine: JDK 25 (Temurin),
# Maven, TeaVM from Maven Central, llvm-mingw (msvcrt, x86_64 host) pinned to the release the
# local builds use. Outputs: jr.exe (= jr-windows-x86_64.exe, the 1.0.0 asset name), the arm64
# cross-build, the same two without jr's icon (what jr-maven-plugin bundles), and SHA256SUMS.
#
# Signing needs, in the repository settings:
#   secret   SIGNPATH_API_TOKEN        a SignPath CI user's API token
#   variable SIGNPATH_ORGANIZATION_ID  the SignPath organization id
# Until the secret exists the signing step is skipped and the release is published unsigned.
# Nothing may touch an exe after SignPath returns it: any change invalidates the signature.
#
# The C launcher that used to be built here lives in its own repository now (jarrunner/jr_legacy_c).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, X.Y.Z'
        required: true
      publish:
        description: 'Publish a GitHub release vX.Y.Z (unticked: build only)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  LLVM_MINGW: llvm-mingw-20260908-msvcrt-x86_64

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "version must be X.Y.Z, got '$v'" }
          $publish = '${{ github.event_name }}' -eq 'push' -or '${{ inputs.publish }}' -eq 'true'
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: llvm-mingw
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$env:LLVM_MINGW.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$env:LLVM_MINGW\bin" >> $env:GITHUB_PATH

      - name: Build
        shell: pwsh
        working-directory: jr
        run: |
          x86_64-w64-mingw32-clang --version | Select-Object -First 1
          powershell -File build-win.ps1
          if ($LASTEXITCODE -ne 0) { throw 'build-win.ps1 failed' }
          powershell -File build-win.ps1 -NoIcon -DistDir dist-noicon
          if ($LASTEXITCODE -ne 0) { throw 'build-win.ps1 -NoIcon failed' }

      - name: Check the exes run
        shell: pwsh
        working-directory: jr
        run: |
          $help = & .\dist\jr-windows-x86_64.exe -Xjr:help 2>&1 | Out-String
          if ($help -notmatch 'Java Runner') { throw "jr -Xjr:help did not answer:`n$help" }
          $res = & .\dist\jr-windows-x86_64.exe -Xjr:list-resources=dist-noicon\jr-windows-x86_64.exe 2>&1 | Out-String
          if ($res -match 'ICON') { throw "the -NoIcon build carries an icon:`n$res" }
          New-Item -ItemType Directory -Force ..\unsigned | Out-Null
          Copy-Item dist\jr-windows-x86_64.exe ..\unsigned\jr.exe
          Copy-Item dist\jr-windows-arm64.exe ..\unsigned\jr-windows-arm64.exe
          Copy-Item dist-noicon\jr-windows-x86_64.exe ..\unsigned\jr-noicon-windows-x86_64.exe
          Copy-Item dist-noicon\jr-windows-arm64.exe ..\unsigned\jr-noicon-windows-arm64.exe
          Get-ChildItem ..\unsigned | ForEach-Object { '{0,-34} {1,9:N0}' -f $_.Name, $_.Length }

      - name: Upload unsigned
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: jr-unsigned
          path: unsigned/
          if-no-files-found: error

      - name: Sign with SignPath
        if: env.SIGNPATH_API_TOKEN != '' && steps.ver.outputs.publish == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: jr
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Release assets
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        run: |
          $from = if (Test-Path signed\jr.exe) { 'signed' } else { Write-Host 'SignPath not configured: releasing unsigned'; 'unsigned' }
          if ($from -eq 'signed') {
            Get-ChildItem signed\*.exe | ForEach-Object { $s = Get-AuthenticodeSignature $_.FullName; if ($s.Status -ne 'Valid') { throw "$($_.Name): signature is $($s.Status)" } }
          }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "$from\*.exe" out
          Copy-Item out\jr.exe out\jr-windows-x86_64.exe
          $sums = Get-ChildItem out\*.exe | Sort-Object Name | ForEach-Object { '{0}  {1}' -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name }
          [IO.File]::WriteAllText("$PWD\out\SHA256SUMS", (($sums -join "`n") + "`n"))

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.ver.outputs.version }}'
          $files = (Get-ChildItem out -File).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "jr ${{ steps.ver.outputs.version }}" --generate-notes --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'publishing the release failed' }
