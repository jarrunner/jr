# Builds jr (the Java/TeaVM launcher) from source on clean Windows and macOS machines and
# publishes it as a GitHub release with SHA256SUMS. Run by pushing a tag vX.Y.Z,
# or by hand from the Actions tab: with publish unticked it only builds, and the binaries are kept
# as workflow artifacts, which is how a change to this file is tested.
#
# Inputs, all fetched by this workflow, nothing from the maintainer's machine: JDK 25 (Temurin),
# Maven, TeaVM from Maven Central, llvm-mingw (UCRT, x86_64 host) pinned to the release the
# local builds use, and the runner's own Xcode on macOS. Outputs: jr.exe (= jr-windows-x86_64.exe,
# the 1.0.0 asset name), the arm64 cross-build, the same two without jr's icon (what
# jr-maven-plugin bundles), jr-macos (universal) with its two thin slices, install.sh (the macOS
# installer), and SHA256SUMS.
#
# The C launcher that used to be built here lives in its own repository now (jarrunner/jr_legacy_c).

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, X.Y.Z (or X.Y.Z-label for a pre-release)'
        required: true
      publish:
        description: 'Publish a GitHub release vX.Y.Z (unticked: build only)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  LLVM_MINGW: llvm-mingw-20260908-ucrt-x86_64

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: llvm-mingw
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$env:LLVM_MINGW.zip"
          Invoke-WebRequest -UseBasicParsing $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\$env:LLVM_MINGW\bin" >> $env:GITHUB_PATH

      - name: Build
        shell: pwsh
        run: |
          x86_64-w64-mingw32-clang --version | Select-Object -First 1
          mvn -B clean package
          if ($LASTEXITCODE -ne 0) { throw 'mvn package failed' }
          mvn -B clean package "-Djr.noicon=true" "-Djr.dist=dist-noicon"
          if ($LASTEXITCODE -ne 0) { throw 'mvn package (no icon) failed' }

      - name: Check the exes run
        shell: pwsh
        run: |
          $help = & .\dist\jr-windows-x86_64.exe -Xjr:help 2>&1 | Out-String
          if ($help -notmatch 'Java Runner') { throw "jr -Xjr:help did not answer:`n$help" }
          $res = & .\dist\jr-windows-x86_64.exe -Xjr:list-resources=dist-noicon\jr-windows-x86_64.exe 2>&1 | Out-String
          if ($res -cmatch '(?m)^\s+ICON\s') { throw "the -NoIcon build carries an icon:`n$res" }
          # 1.2.0 shipped with no version information and Defender flagged it as a trojan (Sabsik !ml).
          foreach ($exe in 'dist\jr-windows-x86_64.exe', 'dist\jr-windows-arm64.exe', 'dist-noicon\jr-windows-x86_64.exe', 'dist-noicon\jr-windows-arm64.exe') {
            $vi = (Get-Item $exe).VersionInfo
            if ($vi.CompanyName -ne 'jarrunner' -or -not $vi.FileDescription -or -not $vi.FileVersion) { throw "$exe carries no version information" }
            '{0}: {1} {2}' -f $exe, $vi.FileDescription, $vi.FileVersion
          }
          New-Item -ItemType Directory -Force unsigned | Out-Null
          Copy-Item dist\jr-windows-x86_64.exe unsigned\jr.exe
          Copy-Item dist\jr-windows-arm64.exe unsigned\jr-windows-arm64.exe
          Copy-Item dist-noicon\jr-windows-x86_64.exe unsigned\jr-noicon-windows-x86_64.exe
          Copy-Item dist-noicon\jr-windows-arm64.exe unsigned\jr-noicon-windows-arm64.exe
          Get-ChildItem unsigned | ForEach-Object { '{0,-34} {1,9:N0}' -f $_.Name, $_.Length }

      # 1.3.0 and earlier (msvcrt) hung for ever, one core at 100%, on an argument like café: TeaVM's UTF-8
      # fallback for mbrtoc16 never ends on a byte that starts an incomplete sequence. Built on the UCRT, jr
      # must start the app and pass the argument through.
      - name: Non-ASCII argument
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force t\src | Out-Null
          Set-Content t\src\H.java 'public class H { public static void main(String[] a) { System.out.println("hello " + String.join(",", a)); } }'
          javac -d t\cls t\src\H.java
          jar --create --file t\h.jar --main-class H -C t\cls .
          $p = Start-Process dist\jr-windows-x86_64.exe -ArgumentList '-Xjr:aot=false', '-Xjr:yes', 't\h.jar', 'café', 'éa' -NoNewWindow -PassThru -RedirectStandardOutput t\o.txt -RedirectStandardError t\e.txt
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw 'jr hung on a non-ASCII argument' }
          $out = Get-Content t\o.txt -Raw
          if ($out -notmatch '^hello caf') { throw "unexpected output: $out $(Get-Content t\e.txt -Raw)" }
          "non-ASCII argument: $out"

      # PRP-35: the checks build (every Buf access checked) is never shipped, so nothing else would
      # notice it breaking. Built after the release exes were copied out; it only writes dist-checks.
      - name: Checks build
        shell: pwsh
        run: |
          mvn -B clean package -Dchecks "-Djr.noicon=true" "-Dteavmc.targets=x86_64"
          if ($LASTEXITCODE -ne 0) { throw 'mvn package -Dchecks failed' }
          $out = & .\dist-checks\jr-windows-x86_64.exe -Xjr:checks-selftest 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $out -notmatch 'native buffer overrun: 4 bytes at offset 2 of a 4-byte buffer') { throw "the checks build did not catch the planted overrun (exit $LASTEXITCODE):`n$out" }
          $rel = & .\dist\jr-windows-x86_64.exe -Xjr:checks-selftest 2>&1 | Out-String
          if ($rel -notmatch 'Unknown jr option') { throw "the release exe knows -Xjr:checks-selftest, so it carries the checks:`n$rel" }
          'checks build: overrun caught; release exe has no checks'
          exit 0  # the last native command's exit code would otherwise end the step

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: jr-unsigned
          path: unsigned/
          if-no-files-found: error

  # macOS: built natively with Apple clang by mvn package (profile macos): arm64, x86_64 and a universal binary,
  # each signed ad hoc (arm64 macOS runs no unsigned code). Ad hoc is not
  # Gatekeeper-approved, so the supported install is install.sh (curl sets no quarantine flag).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: |
          clang --version | head -1
          mvn -B clean package

      - name: Check the binaries run
        run: |
          mkdir -p macos
          cp dist/jr-macos dist/jr-macos-arm64 dist/jr-macos-x86_64 macos/
          for f in macos/*; do
            codesign -v "$f" || { echo "$f is not signed"; exit 1; }
            echo "$(basename $f): $(lipo -archs $f), $(wc -c < $f | tr -d ' ') bytes"
          done
          macos/jr-macos -Xjr:help 2>&1 | grep -q 'Java Runner' || { echo 'jr -Xjr:help did not answer'; exit 1; }
          arch -x86_64 macos/jr-macos -Xjr:help 2>&1 | grep -q 'Java Runner' || { echo 'the x86_64 slice did not answer under Rosetta'; exit 1; }

      # PRP-35: the checks build (into dist-checks/), after the release binaries were copied out.
      - name: Checks build
        run: |
          mvn -B clean package -Dchecks
          out=$(dist-checks/jr-macos-arm64 -Xjr:checks-selftest 2>&1) && { echo "the checks build exited 0"; exit 1; }
          echo "$out" | grep -q 'native buffer overrun: 4 bytes at offset 2 of a 4-byte buffer' || { echo "the checks build did not catch the planted overrun:"; echo "$out"; exit 1; }
          macos/jr-macos -Xjr:checks-selftest 2>&1 | grep -q 'Unknown jr option' || { echo 'the release binary knows -Xjr:checks-selftest'; exit 1; }
          echo 'checks build: overrun caught; release binary has no checks'

      # PRP-42: the JVM in jr's process (jvm=dll through libjli, including the second entry into main that libjli makes
      # on macOS), self-update of a bare binary, and the binary that is also its own .app. The last two run on a
      # throwaway build whose config comes from /tmp (tests/posix/test-build.sh), never on a release binary.
      - name: jvm=dll, self-update and install tests
        run: |
          bash tests/posix/jli-test.sh macos/jr-macos-arm64 "$JAVA_HOME"
          bash tests/posix/test-build.sh "$RUNNER_TEMP/jrtest"
          bash tests/posix/selfupdate-test.sh "$RUNNER_TEMP/jrtest"
          bash tests/posix/install-test.sh "$RUNNER_TEMP/jrtest" tests/posix/fixtures/slot-1.0.bin tests/posix/fixtures/slot-1.1.bin

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: jr-macos
          path: macos/
          if-no-files-found: error

  publish:
    needs: [build, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: ver
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ]; then v='${{ inputs.version }}'; else v='${{ github.ref_name }}'; v=${v#v}; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "version must be X.Y.Z or X.Y.Z-label, got '$v'"; exit 1; }
          publish=false
          if [ '${{ github.event_name }}' = push ] || [ '${{ inputs.publish }}' = true ]; then publish=true; fi
          echo "version=$v" >> $GITHUB_OUTPUT
          echo "publish=$publish" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v7
        if: steps.ver.outputs.publish == 'true'
        with:
          path: in

      - name: Release assets
        if: steps.ver.outputs.publish == 'true'
        run: |
          mkdir -p out
          cp in/jr-unsigned/*.exe in/jr-macos/* install.sh out/
          cp out/jr.exe out/jr-windows-x86_64.exe
          (cd out && sha256sum $(ls | sort) > SHA256SUMS)
          cat out/SHA256SUMS

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v${{ steps.ver.outputs.version }}'
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            # X.Y.Z-label (1.4.0-beta.1) is a pre-release: never "latest", so install.sh and releases/latest keep the last X.Y.Z.
            pre=""; case '${{ steps.ver.outputs.version }}' in *-*) pre="--prerelease --latest=false" ;; esac
            gh release create "$tag" out/* --title "jr ${{ steps.ver.outputs.version }}" --generate-notes --target "$GITHUB_SHA" $pre
          fi
